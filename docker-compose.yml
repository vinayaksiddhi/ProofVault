services:
  postgres:
    image: postgres:16-alpine
    container_name: proofvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofvault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofvault_password}
      POSTGRES_DB: ${POSTGRES_DB:-proofvault_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - proofvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofvault_user} -d ${POSTGRES_DB:-proofvault_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  proofvault_pgdata:
    name: proofvault_pgdata
